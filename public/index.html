<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C++ code block example</title>
    <link rel="stylesheet" href="./codeblocks.css" />
    <script
      src="./codeblocks.js"
      data-coi-serviceworker="./coi-serviceworker.js"
      data-debug
    ></script>
    <style>
      :root { color-scheme: light dark; background: #ffffff; color: #1f2328; font-family: system-ui, sans-serif; }
      body { margin: 0; }
      main { width: min(900px, calc(100% - 32px)); margin: 48px auto; }
      h1 { margin: 0 0 10px; font-size: clamp(28px, 5vw, 44px); }
      p { margin: 0 0 24px; color: #59636e; }
      @media (prefers-color-scheme: dark) {
        :root { background: #0d1117; color: #e6edf3; }
        p { color: #9da7b3; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>C++ code blocks</h1>
      <p>Edit and run this example in your browser.</p>
      <codeblock compiler="gsnapshot" args="-std=c++26 -freflection" debug>
        <codeblock-tab name="main.cpp">
#include &lt;print&gt;
int main() {
    std::println("foo {} bar", 42);
}
        </codeblock-tab>
        <codeblock-tab name="second.cpp">
#include &lt;print&gt;
int main() {
    std::println("This is another tab");
}
        </codeblock-tab>
      </codeblock>
    </main>
  </body>
</html>
